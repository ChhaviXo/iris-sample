services:
  postgres:
    build:
      context: .
      dockerfile: docker/sig40-postgis/Dockerfile
    image: iris-sig40-postgis:16.15-postgis-3.4.6
    container_name: iris-sig40-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - iris_sig40_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  iris_sig40_postgres_data:
